name: CI

# The release workflow only runs on tags, so without this a type error
# would first surface while cutting a release. Build every push instead.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build (type check + bundle)
        run: npm run build

      - name: Lint
        run: npx eslint src
